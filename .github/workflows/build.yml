name: Build, Sign and Deploy Aadi-vault MSIX

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pycryptodome flask

      - name: Build Windows Executable
        shell: pwsh
        run: |
          $addTemplateArg = ""
          if (Test-Path "templates") {
              $addTemplateArg = '--add-data "templates;templates"'
          }

          $iconArg = ""
          if (Test-Path "icon.ico") {
              $iconArg = '--icon="icon.ico"'
          }

          $cmd = "pyinstaller --noconfirm --onefile --windowed " +
                 "$iconArg " +
                 "--collect-all Crypto " +
                 "--collect-all flask " +
                 "--hidden-import=Crypto " +
                 "--hidden-import=Crypto.Cipher.AES " +
                 "--hidden-import=Crypto.Random " +
                 "--hidden-import=Crypto.Util.Padding " +
                 "$addTemplateArg " +
                 "--name app app.py"

          Invoke-Expression $cmd

      - name: Create Package Layout and Assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path msix_layout
          New-Item -ItemType Directory -Force -Path msix_layout\Assets
          New-Item -ItemType Directory -Force -Path public

          Copy-Item -Path "dist\app.exe" -Destination "msix_layout\AadiVault.exe"

          Add-Type -AssemblyName System.Drawing
          $assetConfigs = @(
              @{ Name = "Square44x44Logo.png"; W = 44; H = 44 },
              @{ Name = "Square150x150Logo.png"; W = 150; H = 150 },
              @{ Name = "StoreLogo.png"; W = 50; H = 50 }
          )

          foreach ($cfg in $assetConfigs) {
              $bmp = New-Object System.Drawing.Bitmap $cfg.W, $cfg.H
              $gfx = [System.Drawing.Graphics]::FromImage($bmp)
              $brush = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(24, 24, 27))
              $gfx.FillRectangle($brush, 0, 0, $cfg.W, $cfg.H)
              $dest = Join-Path "msix_layout\Assets" $cfg.Name
              $bmp.Save($dest, [System.Drawing.Imaging.ImageFormat]::Png)
              $gfx.Dispose()
              $bmp.Dispose()
          }

      - name: Write Validated AppxManifest
        shell: pwsh
        run: |
          $manifestContent = @'
<?xml version="1.0" encoding="utf-8"?>
<Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"
         xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10"
         xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities">
  <Identity Name="AdityaRaikyxgo.AadiVaultprime"
            Publisher="CN=C916BD4F-DEA6-4223-BE96-9AB236F7A022"
            Version="1.0.0.0"
            ProcessorArchitecture="x64" />
  <Properties>
    <DisplayName>Aadi-vault</DisplayName>
    <PublisherDisplayName>Aditya Rai (kyxgo)</PublisherDisplayName>
    <Logo>Assets\StoreLogo.png</Logo>
  </Properties>
  <Resources>
    <Resource Language="en-us" />
  </Resources>
  <Dependencies>
    <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.22621.0" />
  </Dependencies>
  <Applications>
    <Application Id="App" Executable="AadiVault.exe" EntryPoint="Windows.FullTrustApplication">
      <uap:VisualElements DisplayName="Aadi-vault"
                          Description="Aadi-vault"
                          BackgroundColor="transparent"
                          Square150x150Logo="Assets\Square150x150Logo.png"
                          Square44x44Logo="Assets\Square44x44Logo.png">
      </uap:VisualElements>
    </Application>
  </Applications>
  <Capabilities>
    <rescap:Capability Name="runFullTrust" />
  </Capabilities>
</Package>
'@
          [System.IO.File]::WriteAllText("$PWD\msix_layout\AppxManifest.xml", $manifestContent, [System.Text.Encoding]::UTF8)

      - name: Pack and Sign Package
        shell: pwsh
        run: |
          $makeappx = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "makeappx.exe" -Recurse | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1).FullName
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1).FullName

          & $makeappx pack /d msix_layout /p "public\AadiVault.msix" /o

          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=C916BD4F-DEA6-4223-BE96-9AB236F7A022" -CertStoreLocation Cert:\CurrentUser\My -HashAlgorithm SHA256
          $pwd = ConvertTo-SecureString -String "KyxgoVault2026" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "signer.pfx" -Password $pwd
          & $signtool sign /f "signer.pfx" /p "KyxgoVault2026" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "public\AadiVault.msix"

      - name: Generate Auto-Download Page
        shell: pwsh
        run: |
          $html = @"
          <!DOCTYPE html>
          <html>
          <head>
            <meta http-equiv="refresh" content="0; url=AadiVault.msix" />
            <title>Downloading Aadi-vault...</title>
          </head>
          <body>
            <h2>Downloading Aadi-vault Package (.msix)...</h2>
            <p>If download doesn't start automatically, <a href="AadiVault.msix">click here to download</a>.</p>
          </body>
          </html>
          "@
          Set-Content -Path "public\index.html" -Value $html

      - name: Upload GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AadiVault-MSIX-Package
          path: public\AadiVault.msix

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
