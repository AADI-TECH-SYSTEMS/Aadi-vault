name: Build, Sign and Deploy AadiTechVault MSIX

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # 👉 YAHAN APNI PARTNER CENTER KI DETAILS REPLACE KARO:
  PC_IDENTITY_NAME: "Aadi-vault"
  PC_PUBLISHER_ID: "CN=Aditya Rai (kyxgo)"
  PC_PUBLISHER_DISPLAY_NAME: "Aditya Rai (kyxgo)"

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pycryptodome flask

      - name: Build Windows Executable
        shell: pwsh
        run: |
          $addTemplateArg = ""
          if (Test-Path "templates") {
              $addTemplateArg = '--add-data "templates;templates"'
          }

          $iconArg = ""
          if (Test-Path "icon.ico") {
              $iconArg = '--icon="icon.ico"'
          }

          $cmd = "pyinstaller --noconfirm --onefile --windowed " +
                 "$iconArg " +
                 "--collect-all Crypto " +
                 "--collect-all flask " +
                 "--hidden-import=Crypto " +
                 "--hidden-import=Crypto.Cipher.AES " +
                 "--hidden-import=Crypto.Random " +
                 "--hidden-import=Crypto.Util.Padding " +
                 "$addTemplateArg " +
                 "--name app app.py"

          Invoke-Expression $cmd

      - name: Prepare MSIX Package Directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path msix_layout
          New-Item -ItemType Directory -Force -Path msix_layout\Assets
          New-Item -ItemType Directory -Force -Path public

          Copy-Item -Path "dist\app.exe" -Destination "msix_layout\AadiVault.exe"

          # Basic PNG generator for MSIX manifest compliance if images don't exist
          Add-Type -AssemblyName System.Drawing
          $sizes = @(44, 50, 150)
          foreach ($sz in $sizes) {
              $bmp = New-Object System.Drawing.Bitmap $sz, $sz
              $gfx = [System.Drawing.Graphics]::FromImage($bmp)
              $brush = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(16, 185, 129))
              $gfx.FillRectangle($brush, 0, 0, $sz, $sz)
              
              if ($sz -eq 44) { $bmp.Save("msix_layout\Assets\Square44x44Logo.png", [System.Drawing.Imaging.ImageFormat]::Png) }
              if ($sz -eq 50) { $bmp.Save("msix_layout\Assets\StoreLogo.png", [System.Drawing.Imaging.ImageFormat]::Png) }
              if ($sz -eq 150) { $bmp.Save("msix_layout\Assets\Square150x150Logo.png", [System.Drawing.Imaging.ImageFormat]::Png) }
              
              $gfx.Dispose()
              $bmp.Dispose()
          }

      - name: Generate AppxManifest.xml
        shell: pwsh
        run: |
          $manifest = @"
          <?xml version="1.0" encoding="utf-8"?>
          <Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"
                   xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10"
                   xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities">
            <Identity Name="$($env:PC_IDENTITY_NAME)"
                      Publisher="$($env:PC_PUBLISHER_ID)"
                      Version="1.0.0.0"
                      ProcessorArchitecture="x64" />
            <Properties>
              <DisplayName>Aadi-vault</DisplayName>
              <PublisherDisplayName>$($env:PC_PUBLISHER_DISPLAY_NAME)</PublisherDisplayName>
              <Logo>Assets\StoreLogo.png</Logo>
            </Properties>
            <Dependencies>
              <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.22621.0" />
            </Dependencies>
            <Applications>
              <Application Id="App" Executable="AadiVault.exe" EntryPoint="Windows.FullTrustApplication">
                <uap:VisualElements DisplayName="Aadi-vault"
                                    Description="Secure File Encryption Vault"
                                    BackgroundColor="transparent"
                                    Square150x150Logo="Assets\Square150x150Logo.png"
                                    Square44x44Logo="Assets\Square44x44Logo.png">
                </uap:VisualElements>
              </Application>
            </Applications>
            <Capabilities>
              <rescap:Capability Name="runFullTrust" />
            </Capabilities>
          </Package>
          "@
          Set-Content -Path "msix_layout\AppxManifest.xml" -Value $manifest

      - name: Pack and Sign MSIX
        shell: pwsh
        run: |
          $makeappx = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "makeappx.exe" -Recurse | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1).FullName
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1).FullName

          # 1. Create MSIX Package
          & $makeappx pack /d msix_layout /p "public\AadiVault.msix" /nv

          # 2. Generate matching certificate and sign
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "$($env:PC_PUBLISHER_ID)" -CertStoreLocation Cert:\CurrentUser\My -HashAlgorithm SHA256
          $pwd = ConvertTo-SecureString -String "KyxgoVault2026" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "signer.pfx" -Password $pwd
          & $signtool sign /f "signer.pfx" /p "KyxgoVault2026" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "public\AadiVault.msix"

      - name: Create Index HTML for Auto-Download
        shell: pwsh
        run: |
          $html = @"
          <!DOCTYPE html>
          <html>
          <head>
            <meta http-equiv="refresh" content="0; url=AadiVault.msix" />
            <title>Downloading Aadi Vault MSIX...</title>
          </head>
          <body>
            <h2>Downloading Aadi Vault Package (.msix)...</h2>
            <p>If download doesn't start automatically, <a href="AadiVault.msix">click here to download</a>.</p>
          </body>
          </html>
          "@
          Set-Content -Path "public\index.html" -Value $html

      - name: Upload GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AadiVault-MSIX-Package
          path: public\AadiVault.msix

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
